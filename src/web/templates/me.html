{% extends "base.html" %}
{% set section = "me" %}
{% block title %}About · Andreas Atle{% endblock %}

{% block content %}
<section class="page-hero">
  <div class="wrap narrow">
    <div class="breadcrumb"><a href="/">atle.dev</a> / about</div>
    <h1>Andreas Atle</h1>
    <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:8px">
      <div class="toggle" role="group" aria-label="View">
        <button type="button" data-view="profile" aria-pressed="{{ 'true' if view == 'profile' else 'false' }}">Profile</button>
        <button type="button" data-view="resume" aria-pressed="{{ 'false' if view == 'profile' else 'true' }}">Resume</button>
      </div>
      <a class="btn" href="mailto:atle.andreas@gmail.com">Email me</a>
    </div>
  </div>
</section>

<section class="section" style="padding-top:48px">
  <div class="wrap narrow">
    <article class="prose" id="profile-view"{% if view != "profile" %} hidden{% endif %}>
      {{ profile_html | safe }}
    </article>
    <article class="prose" id="resume-view"{% if view == "profile" %} hidden{% endif %}>
      {{ resume_html | safe }}
    </article>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  document.querySelectorAll(".toggle [data-view]").forEach((b) => {
    b.addEventListener("click", () => {
      const v = b.dataset.view;
      document.getElementById("profile-view").hidden = v !== "profile";
      document.getElementById("resume-view").hidden = v !== "resume";
      document.querySelectorAll(".toggle [data-view]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      history.replaceState(null, "", v === "profile" ? "/me" : "/me?view=resume");
    });
  });
</script>
{% endblock %}
